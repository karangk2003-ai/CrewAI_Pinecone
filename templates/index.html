<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <!-- Use a modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Phosphor Icons for elegant UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel main-header">
            <div class="logo-area">
                <i class="ph ph-books glass-icon"></i>
                <div class="title-group">
                    <h1>AI Study Assistant</h1>
                    <span class="subtitle">CrewAI + Pinecone + Ollama</span>
                </div>
            </div>
            <div class="theme-toggle" id="themeToggle" title="Toggle Theme">
                <i class="ph ph-sun"></i>
            </div>
        </header>

        <main class="content-grid">
            <!-- Left Column: Upload -->
            <section class="upload-section glass-panel fade-in-up" style="animation-delay: 0.1s;">
                <div class="section-header">
                    <h2><i class="ph ph-upload-simple"></i> Upload Study Material</h2>
                </div>
                <div class="upload-area" id="dropZone">
                    <i class="ph ph-file-pdf document-icon"></i>
                    <p>Drag & Drop your PDF here</p>
                    <span class="or-divider">or</span>
                    <input type="file" id="fileInput" accept="application/pdf" hidden>
                    <button class="btn-primary glow-effect" onclick="document.getElementById('fileInput').click()">
                        Choose PDF
                    </button>
                    <div id="selectedFileName" class="file-name-display"></div>
                </div>
                <button id="uploadBtn" class="btn-success disabled" disabled>Upload & Process</button>
                
                <div id="uploadStatus" class="status-message"></div>
                
                <!-- Loading indicator for upload -->
                <div id="uploadLoader" class="loader-container hidden">
                    <div class="spinner"></div>
                    <p>Extracting, Chunking & Indexing to Pinecone...</p>
                </div>
            </section>

            <!-- Right Column: Ask & Answer -->
            <section class="qa-section glass-panel fade-in-up" style="animation-delay: 0.2s;">
                <div class="section-header">
                    <h2><i class="ph ph-magnifying-glass"></i> Ask a Question</h2>
                </div>
                <div class="input-group">
                    <textarea id="questionInput" placeholder="What is supervised learning?" rows="3"></textarea>
                    <button id="askBtn" class="btn-primary glow-effect">
                        <i class="ph ph-paper-plane-right"></i> Ask Question
                    </button>
                    <button id="clearBtn" class="btn-secondary" style="margin-top: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;">
                        <i class="ph ph-trash"></i> Clear
                    </button>
                </div>

                <div id="askLoader" class="loader-container hidden">
                    <div class="multi-agent-steps">
                        <div class="agent-step active" id="step-retrieve">
                            <i class="ph ph-database"></i> Retrieving from Pinecone
                        </div>
                        <div class="agent-step" id="step-research">
                            <i class="ph ph-magnifying-glass-plus"></i> Research Agent working
                        </div>
                        <div class="agent-step" id="step-analyze">
                            <i class="ph ph-brain"></i> Analysis Agent working
                        </div>
                        <div class="agent-step" id="step-review">
                            <i class="ph ph-check-circle"></i> Review Agent verifying
                        </div>
                    </div>
                </div>

                <!-- Results Display -->
                <div id="resultContainer" class="result-container hidden fade-in">
                    <div class="verification-badge" id="verificationBadge">
                        <i class="ph ph-seal-check"></i> <span>Verification: PASS</span>
                    </div>
                    
                    <div class="answer-box">
                        <h3>Answer</h3>
                        <div id="answerContent" class="answer-content">
                            <!-- Answer text goes here -->
                        </div>
                    </div>

                    <div class="sources-box">
                        <h3><i class="ph ph-bookmarks"></i> Sources</h3>
                        <ul id="sourcesList" class="sources-list">
                            <!-- Sources go here -->
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
